<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Palma</title>
<meta name="description" content="Opening this profile in Palma — the Catholic workout tracker.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0E1D16; color: #F1ECE0;
    font-family: "Hanken Grotesk", -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  .wrap { max-width: 420px; display: grid; gap: 14px; justify-items: center; }
  img.icon { width: 84px; height: 84px; border-radius: 19px; }
  h1 { font-size: 1.35rem; margin: 0; font-weight: 700; }
  p { margin: 0; color: rgba(241,236,224,.75); line-height: 1.5; font-size: .95rem; }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    background: #D4B872; color: #0E1D16; font-weight: 700; text-decoration: none;
    margin: 4px;
  }
  a.ghost { background: transparent; color: #D4B872; border: 1.5px solid #D4B872; }
  .stores { display: none; }
  .stores.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" src="/favicon.png" alt="Palma app icon">
  <h1>Opening in Palma…</h1>
  <p id="lede">If nothing happens, Palma may not be installed yet — it's free on both stores.</p>
  <div class="stores" id="stores">
    <a class="btn" href="https://apps.apple.com/us/app/palma-running/id6806122487">App&nbsp;Store</a>
    <a class="btn ghost" href="https://play.google.com/store/apps/details?id=com.palmarum.palma">Google&nbsp;Play</a>
  </div>
</div>
<script>
  // A Palma QR code lands here: /p/?u=<userId>. Bounce into the app's
  // member page; if the app never claims the scheme (not installed), show
  // the store buttons after a beat.
  (function () {
    var u = new URLSearchParams(location.search).get('u') || '';
    var ok = /^[0-9a-f-]{16,64}$/i.test(u);
    if (ok) {
      location.href = 'palma://member/' + encodeURIComponent(u);
    } else {
      document.getElementById('lede').textContent =
        'This link is missing its profile — but Palma itself is right here.';
    }
    setTimeout(function () {
      document.getElementById('stores').className = 'stores show';
    }, ok ? 1500 : 0);
  })();
</script>
</body>
</html>
